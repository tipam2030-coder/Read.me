name: Update README Timestamp

on:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update timestamp in README
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s|<!--LAST_UPDATED-->.*|<!--LAST_UPDATED-->Last updated: $DATE|" README.md

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Auto-update README timestamp"
          git push
